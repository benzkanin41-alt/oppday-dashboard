name: Update Bubble Risk Dashboard

on:
  workflow_dispatch:
  schedule:
    # 07:00 Asia/Bangkok daily.
    - cron: '0 7 * * *'
      timezone: 'Asia/Bangkok'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bubble-risk-dashboard
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}bubble-risk-dashboard/
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser smoke-test dependency
        shell: pwsh
        run: npm ci --prefix bubble-risk-dashboard-src/work --ignore-scripts --no-audit --no-fund

      - name: Install dashboard dependencies
        shell: pwsh
        run: python -m pip install PyPDF2==3.0.1

      - name: Refresh source-backed dashboard data
        shell: pwsh
        run: |
          cd bubble-risk-dashboard-src
          python -X utf8 .\work\update_local_dashboard_full.py

      - name: Validate refreshed dashboard
        shell: pwsh
        run: |
          cd bubble-risk-dashboard-src
          python -X utf8 .\work\validate_macro_v04_nonzero.py
          python -X utf8 .\work\validate_froth_components_populated.py
          python -X utf8 .\work\validate_current_market_indicators.py
          python -X utf8 .\work\validate_current_summary_sync.py
          python -X utf8 .\work\validate_thailand_heat_mai_treasury.py
          python -X utf8 .\work\validate_final_dashboard.py
          python -X utf8 .\work\validate_ai_direct_v08.py
          python -X utf8 .\work\validate_layout_manifest_order.py
          python -X utf8 .\work\validate_ai_direct_interactive.py
          python -X utf8 .\work\validate_dashboard_v04.py
          python -X utf8 .\work\validate_dashboard_v04b.py
          python -X utf8 .\work\validate_refresh_hard_guards.py

      - name: Publish refreshed static files into docs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path docs\bubble-risk-dashboard | Out-Null
          Copy-Item -LiteralPath bubble-risk-dashboard-src\outputs\dashboard\index.html -Destination docs\bubble-risk-dashboard\index.html -Force
          Copy-Item -LiteralPath bubble-risk-dashboard-src\outputs\dashboard\data.json -Destination docs\bubble-risk-dashboard\data.json -Force
          Copy-Item -LiteralPath bubble-risk-dashboard-src\outputs\dashboard\source-manifest.json -Destination docs\bubble-risk-dashboard\source-manifest.json -Force

      - name: Commit refreshed data and chart history
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bubble-risk-dashboard bubble-risk-dashboard-src/outputs/dashboard bubble-risk-dashboard-src/work/raw bubble-risk-dashboard-src/work/last_dashboard_update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update bubble risk dashboard data [skip ci]"
            git push
          }

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-scheduled-failure:
    if: ${{ always() && github.event_name == 'schedule' && needs.update-and-deploy.result == 'failure' }}
    needs: update-and-deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign a failure alert to repository owner
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runId = String(context.runId);
            const title = `Bubble dashboard scheduled refresh failed (${runId})`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', creator: 'github-actions[bot]', per_page: 100
            });
            if (issues.some(issue => !issue.pull_request && issue.title === title)) {
              core.info(`Alert already exists for run ${runId}`);
              return;
            }
            await github.rest.issues.create({
              owner, repo, title, assignees: [owner],
              body: `The scheduled Bubble Risk Dashboard refresh failed. Review the run: ${runUrl}`
            });

